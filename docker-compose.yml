services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: defa
      POSTGRES_USER: defa
      POSTGRES_PASSWORD: defa_dev_password
    volumes:
      - defa_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U defa -d defa"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    command: sh -c "python manage.py migrate && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --access-logfile -"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      DJANGO_SECRET_KEY: dev-secret-change-before-production
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: "*"
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: defa
      DB_USER: defa
      DB_PASSWORD: defa_dev_password
      DB_HOST: db
      DB_PORT: "5432"
      CORS_ALLOWED_ORIGINS: ""
    depends_on:
      db:
        condition: service_healthy
volumes:
  defa_pgdata:
