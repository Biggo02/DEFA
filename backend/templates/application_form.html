{% extends 'base.html' %}{% block title %}Nouvelle demande — DEFA{% endblock %}{% block content %}<section class="page"><span class="pill">NOUVELLE DEMANDE</span><h1>Demander un prêt</h1><p>Minimum 100 000 FC, uniquement par tranches de 100 000 FC. Frais : 12 %.</p><form method="post" class="card form">{% csrf_token %}<label>Montant souhaité (FC)<input name="amount" type="number" min="100000" step="100000" value="100000" required></label><label>Durée (jours)<input name="duration_days" type="number" min="7" value="30" required></label><label>Fréquence<select name="frequency"><option value="WEEKLY">Hebdomadaire</option><option value="MONTHLY">Mensuelle</option></select></label><label>Objet<select name="purpose"><option value="BUSINESS">Commerce</option><option value="STOCK">Stock</option><option value="EQUIPMENT">Équipement</option><option value="PERSONAL">Personnel</option><option value="EMERGENCY">Urgence</option><option value="OTHER">Autre</option></select></label><label>Détail<textarea name="purpose_detail"></textarea></label><div class="grid two"><label>Revenu mensuel<input name="monthly_income" type="number" min="0" value="0"></label><label>Charges mensuelles<input name="monthly_expenses" type="number" min="0" value="0"></label></div><button class="btn">Enregistrer la demande</button></form></section>{% endblock %}
