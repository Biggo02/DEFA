{% extends 'base.html' %}
{% block title %}Mon profil — DEFA{% endblock %}
{% block content %}<section class="page narrow"><span class="pill">PROFIL</span><h1>Mon profil</h1><form method="post" class="card form">{% csrf_token %}<label>Prénom<input value="{{ user.first_name }}" disabled></label><label>Nom<input value="{{ user.last_name }}" disabled></label><label>Nom d'utilisateur<input value="{{ user.username }}" disabled></label><label>Téléphone<input name="phone" value="{{ profile.phone }}" required></label><label>Numéro de pièce d’identité<input name="national_id" value="{{ profile.national_id }}"></label><button class="btn">Enregistrer</button></form><div class="card"><strong>Statut KYC</strong><p>{% if profile.verified %}Profil vérifié.{% else %}Profil en attente de vérification par DEFA.{% endif %}</p></div></section>{% endblock %}
